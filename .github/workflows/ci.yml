name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的重复 push / PR 更新只保留最新一次，避免重复占用 runner
concurrency:
  group: ci-${github.workflow}-${github.ref}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "3"
  RUSTUP_MAX_RETRY: "3"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  # sccache 的 GHA 后端必须走 Cache Service v2：v1 API 已被 GitHub 下线，
  # 还在用 v1 时每次写入都会失败，sccache 退化成只读模式
  #（effective_cache_mode=ReadOnly、cache_writes=0、命中永远是 0），
  # 等于白付一次远端查找的开销。mozilla-actions/sccache-action 从 v0.0.11
  # 起会自己导出这个变量，这里再显式写一份，防止 action 版本回退。
  ACTIONS_CACHE_SERVICE_V2: "on"
  # dev/test profile 默认带调试信息(debug=2)，会给 295 个依赖全部生成 DWARF/PDB，
  # 既拖慢编译，又让缓存体积膨胀数倍（本地 target/debug 已达 15GB）。
  # CI 不需要调试信息，关掉可以同时省编译时间和缓存传输时间。
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # lint 与 test 拆成两个并行 job：两者的依赖编译产物不共享，串行跑等于
  # 把两轮编译时间相加，并行后墙钟时间取两者的最大值。
  lint:
    name: fmt + clippy
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # 与 rust-toolchain.toml 保持一致；写死版本避免 stable 发版
          # 让 sccache / rust-cache 的缓存指纹全部失效
          toolchain: 1.100.0
          components: rustfmt, clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        # v0.0.11 起会导出 ACTIONS_CACHE_SERVICE_V2=on，sccache 才能用上
        # Cache Service v2（v1 已被 GitHub 下线，写入会全部失败）。
        # 该版本只认 version/token/disable_annotations，没有 fail-on-cache-err，
        # 之前写的那个输入是空转的，每轮还会刷一条 Unexpected input 警告。

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          shared-key: "ci-windows"
          cache-all-crates: true
          # 编译复用交给 sccache。这里只缓存依赖源码（~/.cargo/registry、
          # ~/.cargo/git），不再搬运 GB 级 target 目录——缓存 restore/save
          # 曾经占到整个 job 的一半以上时间。
          cache-targets: false

      - name: Check formatting
        # 先 fmt --all 兜底(让忘了本地 fmt 的 push 也能过),再 --check 验证
        # 这样如果还有差异就是 rustfmt 版本差异,而不是开发者忘了 fmt
        # runner 默认 shell 是 PowerShell,语法要按 ps 写
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if ! cargo fmt --all -- --check; then
            echo "::error::cargo fmt --all 之后仍存在差异,通常是 rustfmt 版本不一致导致。请本地执行 cargo fmt --all 后提交。"
            cargo fmt --all -- --check || true
            exit 1
          fi

      # clippy --all-targets 已经覆盖 cargo check 的全部检查范围，
      # 因此不再单独跑 cargo check：check 只产出 metadata，test 需要全量
      # codegen，两者产物不共享，等于白编一轮依赖。
      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Report sccache stats
        if: always()
        run: sccache --show-stats

  test:
    name: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        # v0.0.11 起会导出 ACTIONS_CACHE_SERVICE_V2=on，sccache 才能用上
        # Cache Service v2（v1 已被 GitHub 下线，写入会全部失败）。
        # 该版本只认 version/token/disable_annotations，没有 fail-on-cache-err，
        # 之前写的那个输入是空转的，每轮还会刷一条 Unexpected input 警告。

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          shared-key: "ci-windows"
          cache-all-crates: true
          cache-targets: false

      - name: Run tests
        run: cargo test --locked --workspace

      - name: Report sccache stats
        if: always()
        run: sccache --show-stats
