name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 3
  RUSTUP_MAX_RETRY: 3
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.8
        with:
          # ghac (artifactcache) 偶发 400/5xx,降级为本地缓存而不是直接 fail
          fail-on-cache-err: false

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          shared-key: "ci-windows"
          cache-all-crates: true

      - name: Check formatting
        # 先 fmt --all 兜底(让忘了本地 fmt 的 push 也能过),再 --check 验证
        # 这样如果还有差异就是 rustfmt 版本差异,而不是开发者忘了 fmt
        # runner 默认 shell 是 PowerShell,语法要按 ps 写
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if ! cargo fmt --all -- --check; then
            echo "::error::cargo fmt --all 之后仍存在差异,通常是 rustfmt 版本不一致导致。请本地执行 cargo fmt --all 后提交。"
            cargo fmt --all -- --check || true
            exit 1
          fi

      - name: Check workspace
        run: cargo check --locked --workspace --all-targets

      - name: Run tests
        run: cargo test --locked --workspace

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
