# Release 工作流：为 Windows 构建并用 Inno Setup 打包发布
# 触发：push 到语义化 tag（例如 v1.2.3）会创建 GitHub Release 并上传安装包
name: "Release — Windows"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag，例如 v1.0.0"
        required: false
  workflow_call:
    inputs:
      tag:
        description: "要发布的 tag，例如 v1.0.0"
        required: false
        type: string

# 同一 tag 的并发构建只保留最新一次，避免重复劳动
concurrency:
  group: release-windows-${inputs.tag || github.ref}
  cancel-in-progress: true

# 仅保留实际需要的权限
permissions:
  contents: write

jobs:
  build-windows:
    name: Build & release (Windows)
    runs-on: windows-latest
    # 防止异常任务卡死 runner
    timeout-minutes: 30

    env:
      WINDOWS_SIGN_CERT: ${{ secrets.WINDOWS_SIGN_CERT }}
      WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
      CARGO_INCREMENTAL: "0"
      CARGO_NET_RETRY: "3"
      RUSTUP_MAX_RETRY: "3"
      # 与 CI 共用同一套 sccache 后端：295 个依赖的编译产物可以跨 workflow 复用
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      # sccache 的 GHA 后端必须走 Cache Service v2：v1 API 已被 GitHub 下线，
      # 还在用 v1 时每次写入都会失败，sccache 退化成只读模式
      #（effective_cache_mode=ReadOnly、cache_writes=0、命中永远是 0）。
      # mozilla-actions/sccache-action 从 v0.0.11 起会自己导出这个变量，
      # 这里再显式写一份，防止 action 版本回退。
      ACTIONS_CACHE_SERVICE_V2: "on"
      SIGNTOOL_PATH: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 浅克隆即可：tag 推送时 checkout 直接落在 tag 的 commit 上，
          # 不需要拉全量历史
          fetch-depth: 1

      - name: Resolve release tag
        id: resolve_tag
        shell: pwsh
        run: |
          # inputs.tag 同时覆盖 workflow_dispatch 与 workflow_call 两种触发方式
          $inputTag = '${{ inputs.tag }}'
          if ($inputTag -ne '') {
            $tag = $inputTag
          } elseif ('${{ github.ref }}' -like 'refs/tags/*') {
            $tag = '${{ github.ref_name }}'
          } else {
            Write-Error "No tag provided."
            exit 1
          }
          if ($tag -notmatch '^[vV]\d') {
            Write-Error "Invalid tag format: $tag"
            exit 1
          }
          # 从 tag (如 v1.2.3) 提取纯版本号 (1.2.3) 供 Inno Setup 使用
          $version = $tag -replace '^[vV]', ''
          echo "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          echo "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Resolved tag: $tag, version: $version"

      - name: Checkout release tag
        shell: pwsh
        run: |
          # 浅克隆里不一定带 tag 对象，统一显式抓取一次（tag 推送时已是同一 commit，
          # 这次 fetch 只要 1~2 秒；手动触发时才是必需步骤）
          # 必须写成 $($env:RELEASE_TAG) 而不是 $env:RELEASE_TAG：
          # 双引号里 "$env:RELEASE_TAG:refs/..." 会被 PowerShell 解析成变量名
          # "RELEASE_TAG:refs"（冒号被吞进名字），展开成空串，refspec 变成
          # "+refs/tags//tags/v0.3.15"，git 直接报 invalid refspec。
          git fetch --depth 1 origin "+refs/tags/$($env:RELEASE_TAG):refs/tags/$($env:RELEASE_TAG)"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to fetch tag $env:RELEASE_TAG"
            exit 1
          }
          git checkout --detach $($env:RELEASE_TAG)
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to checkout $env:RELEASE_TAG"
            exit 1
          }
          Write-Host "HEAD = $((git rev-parse HEAD).Trim())"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # 与 rust-toolchain.toml 保持一致；写死版本才能复用 sccache 缓存
          toolchain: 1.100.0
          components: rustfmt, clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        # v0.0.11 起会导出 ACTIONS_CACHE_SERVICE_V2=on，sccache 才能用上
        # Cache Service v2（v1 已被 GitHub 下线，写入会全部失败）。
        # 该版本只认 version/token/disable_annotations，没有 fail-on-cache-err，
        # 之前写的那个输入是空转的。

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          shared-key: "release-windows"
          # 缓存 cargo 安装的二进制工具
          cache-all-crates: true
          # 只缓存依赖源码，编译复用交给 sccache：
          # release 产物（release profile）体积大，上传一次要几十秒
          cache-targets: false
          # 即使构建失败也保留（方便调试），此时保存的只有依赖源码缓存
          save-if: "true"

      # 缓存 Inno Setup 安装目录，避免每次 choco install（约省 30-60s）
      - name: Cache Inno Setup
        id: cache-inno
        uses: actions/cache@v4
        with:
          path: C:\Program Files (x86)\Inno Setup 6
          key: innosetup-6-v1

      - name: Install Inno Setup 6
        if: steps.cache-inno.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress --no-upgrade-check

      - name: Add Inno Setup to PATH
        shell: pwsh
        run: |
          $innoDir = "C:\Program Files (x86)\Inno Setup 6"
          if (Test-Path (Join-Path $innoDir "ISCC.exe")) {
            Add-Content -Path $env:GITHUB_PATH -Value $innoDir
            Write-Host "Added $innoDir to GITHUB_PATH"
          } else {
            Write-Error "ISCC.exe not found at $innoDir"
            exit 1
          }

      - name: Build winui3_gui (release)
        env:
          # 仓库默认 profile 是 lto=true + codegen-units=1（fat LTO 单 codegen unit），
          # 链接阶段无法并行，是整个发布流程最大的耗时点。
          # 这里只在 CI 里覆盖成 thin LTO + 16 个 codegen unit：
          # 链接时间显著下降，仓库默认 profile 保持不变，本地发版仍是 fat LTO。
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --locked --release --package winui3_gui

      # 合并 PFX 解码与 signtool 定位，只执行一次（有证书时）
      - name: Prepare code signing
        if: ${{ env.WINDOWS_SIGN_CERT && env.WINDOWS_SIGN_PASSWORD }}
        id: prepare_sign
        shell: pwsh
        run: |
          Write-Host "Decoding PFX from secret and writing to runner temp"
          [System.IO.File]::WriteAllBytes("$env:RUNNER_TEMP\codesign.pfx", [System.Convert]::FromBase64String('${{ env.WINDOWS_SIGN_CERT }}'))
          Write-Host "Importing PFX into personal cert store"
          certutil -f -p "$env:WINDOWS_SIGN_PASSWORD" -importpfx "$env:RUNNER_TEMP\codesign.pfx"

          # 一次性查找 signtool.exe，结果存到 GITHUB_ENV 供后续步骤复用
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) {
            Write-Error "signtool.exe not found"
            exit 1
          }
          echo "SIGNTOOL_PATH=$($signtool.FullName)" >> $env:GITHUB_ENV
          Write-Host "Found signtool: $($signtool.FullName)"

      - name: Sign executable (only if cert provided)
        if: ${{ env.WINDOWS_SIGN_CERT && env.WINDOWS_SIGN_PASSWORD }}
        shell: pwsh
        run: |
          Write-Host "Signing exe"
          & $env:SIGNTOOL_PATH sign /v /fd SHA256 /a /tr http://timestamp.digicert.com /td SHA256 "target\release\winui3_gui.exe"

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          Write-Host "Building installer for version $env:RELEASE_VERSION"
          # 使用项目自带的打包脚本，跳过 cargo build（已在上一步完成）
          & .\scripts\build-installer.ps1 -NoBuild -Version $env:RELEASE_VERSION

      - name: Sign installer (only if cert provided)
        if: ${{ env.WINDOWS_SIGN_CERT && env.WINDOWS_SIGN_PASSWORD }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem ".\installer\Output\AudioRouter-Setup-*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) {
            Write-Error "Installer not found"
            exit 1
          }
          Write-Host "Signing installer: $($installer.FullName)"
          & $env:SIGNTOOL_PATH sign /v /fd SHA256 /a /tr http://timestamp.digicert.com /td SHA256 $installer.FullName

      # 构建失败时上传日志和中间产物便于排查
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ env.RELEASE_TAG || 'untagged' }}
          path: |
            target/release/winui3_gui.exe
            installer/Output/
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem ".\installer\Output\AudioRouter-Setup-*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) {
            Write-Error "Installer not found!"
            exit 1
          }
          $sizeMB = [math]::Round($installer.Length / 1MB, 2)
          Write-Host "Installer: $($installer.Name)"
          Write-Host "Size: $sizeMB MB"

          # 写入构建摘要，GitHub Release/Actions 页面会展示
          $summary = @"
          ## Build Summary

          | Item | Value |
          |------|-------|
          | Version | ``$env:RELEASE_VERSION`` |
          | Installer | ``$($installer.Name)`` |
          | Size | $sizeMB MB |
          | Signed | $(if ($env:WINDOWS_SIGN_CERT) { 'Yes' } else { 'No' }) |
          "@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Report sccache stats
        if: always()
        run: sccache --show-stats

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            installer/Output/AudioRouter-Setup-*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
          name: AudioRouter ${{ env.RELEASE_TAG }}
