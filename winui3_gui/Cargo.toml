[package]
name = "winui3_gui"
version = "0.3.17"
edition = "2021"
rust-version = "1.95"

[features]
default = []
# 框架依赖部署：WinUI 不再把 WindowsAppRuntime 运行时随包发布，
# 改为引用系统上已安装的 WindowsAppRuntime 包；没装时启动会弹官方
# 快速安装界面（由 windows_reactor::bootstrap() 触发）。
# 打包时用 scripts\build-installer.ps1 -DeploymentMode framework-dependent。
framework-dependent = []

[dependencies]
app_core = { path = "../app_core" }
audio_core = { path = "../audio_core" }
config = { path = "../config" }
ureq = { version = "3", default-features = false, features = [
    "json",
    "native-tls",
] }
serde = { version = "1", features = ["derive"] }
semver = { version = "1", features = ["serde"] }
windows-reactor = { git = "https://github.com/microsoft/windows-rs", rev = "a48e42ebe507985f2f474c4007fe8db2141371a4" }
windows-core = { version = "0.62.2", features = ["std"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
dark-light = "3"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Security",
] }
parking_lot = "0.13"

[build-dependencies]
windows-reactor-setup = { git = "https://github.com/microsoft/windows-rs", rev = "a48e42ebe507985f2f474c4007fe8db2141371a4" }
# 把 assets/icon.ico 嵌入到 exe 资源段，使 exe 在任务栏/开始菜单/资源管理器
# 中显示项目图标（不依赖外部文件）。
winres = "0.1"
