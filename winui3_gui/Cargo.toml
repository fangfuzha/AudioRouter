[package]
name = "winui3_gui"
version = "0.3.10"
edition = "2021"
rust-version = "1.95"

[dependencies]
app_core = { path = "../app_core" }
audio_core = { path = "../audio_core" }
config = { path = "../config" }
ureq = { version = "3", default-features = false, features = [
    "json",
    "native-tls",
] }
serde = { version = "1", features = ["derive"] }
semver = { version = "1", features = ["serde"] }
windows-reactor = { git = "https://github.com/microsoft/windows-rs", rev = "3415ce9f856aeaf79555bbbfac5acb02405dcc89" }
windows-core = { version = "0.62.2", features = ["std"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
dark-light = "3"
tray-icon = { version = "0.24", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Security",
] }
parking_lot = "0.12"

[build-dependencies]
windows-reactor-setup = { git = "https://github.com/microsoft/windows-rs", rev = "3415ce9f856aeaf79555bbbfac5acb02405dcc89" }
# 把 assets/icon.ico 嵌入到 exe 资源段，使 exe 在任务栏/开始菜单/资源管理器
# 中显示项目图标（不依赖外部文件）。
winres = "0.1"
