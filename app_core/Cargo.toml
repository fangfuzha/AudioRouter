[package]
name = "app_core"
version = "0.1.0"
edition = "2024"

[dependencies]
audio_core = { path = "../audio_core" }
config = { path = "../config" }
anyhow = "1"
parking_lot = "0.13"
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_System_Registry",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Storage_FileSystem",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_System_IO",
  "Win32_Security",
] }
